<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quentin Petty — Portfolio</title>
<meta name="description" content="Quentin Petty — footwear and fashion prototypes, handmade accessories: purses, belts and bags.">
<meta property="og:title" content="Quentin Petty — Portfolio">
<meta property="og:description" content="Footwear &amp; fashion prototypes. Handmade accessories — purses, belts, bags.">
<meta property="og:image" content="assets/cover.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a0a09">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" as="image" href="assets/cover.jpg">
<link rel="stylesheet" href="styles.css?v=20260929-2">
</head>
<body>

<!-- ============ COVER ============ -->
<section id="cover" class="cover" aria-label="Cover">
  <picture class="cover-picture">
  <source media="(max-width: 560px)" srcset="assets/phonecover.png">
  <img class="cover-img" src="assets/cover.jpg" alt="Quentin Petty — hand-signed cover" fetchpriority="high">
</picture>
  <div class="cover-meta">
    <div>QUENTIN&nbsp;PETTY&nbsp;—&nbsp;2026</div>
    <a href="mailto:quentinpetty04@gmail.com" draggable="false">QUENTINPETTY04@GMAIL.COM</a>
    <a href="tel:+14053122530" draggable="false">405-312-2530</a>
  </div>
  <div class="cover-nav">
    <button class="cover-btn" data-enter="portfolio">01&nbsp;/&nbsp;PORTFOLIO</button>
    <button class="cover-btn" data-enter="works">02&nbsp;/&nbsp;WORKS</button>
  </div>
</section>

<!-- ============ PAGE SHELL ============ -->
<div id="page" class="page" hidden>
  <header class="topbar">
    <button class="brand" data-go="cover">QUENTIN&nbsp;PETTY</button>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" id="tab-portfolio" data-tab="portfolio">PORTFOLIO</button>
      <button class="tab" id="tab-works" data-tab="works">WORKS</button>
    </nav>
  </header>

  <!-- grid -->
  <main id="grid-view">
    <div class="page-head">
      <h1 id="page-title">PORTFOLIO</h1>
      <div class="page-sub" id="page-sub">FOOTWEAR &amp; FASHION PROTOTYPES</div>
    </div>
    <div class="grid" id="grid"></div>
    <footer class="footer">© QUENTIN PETTY — ALL WORK HANDMADE</footer>
  </main>

  <!-- detail -->
  <main id="detail-view" class="detail" hidden>
    <button class="back-btn" id="back-btn">← BACK</button>
    <div class="detail-layout">
      <div class="detail-images" id="detail-images"></div>
      <aside class="detail-info">
        <div class="detail-kicker" id="detail-kicker"></div>
        <h2 id="detail-name"></h2>
        <a class="inquire-btn" id="inquire-btn" hidden>INQUIRE</a>
      </aside>
    </div>
  </main>
</div>

<dialog id="image-viewer" class="image-viewer" aria-label="Portfolio image viewer">
  <div class="viewer-toolbar">
    <span id="viewer-counter" aria-live="polite"></span>
    <button id="viewer-prev" type="button" aria-label="Previous image" title="Previous image">&#8592;</button>
    <button id="viewer-next" type="button" aria-label="Next image" title="Next image">&#8594;</button>
    <button id="viewer-close" type="button" aria-label="Close image" title="Close image" autofocus>&#215;</button>
  </div>
  <img id="viewer-image" alt="">
</dialog>

<!-- ============ TRANSITION LAYERS ============ -->
<div id="fx-neg" class="fx" hidden>
  <picture class="fx-picture">
    <source media="(max-width: 560px)" srcset="assets/phonecover.png">
    <img src="assets/cover.jpg" alt="" class="fx-img to-negative">
  </picture>
  <div class="fx-flash flash-pop"></div>
</div>
<div id="fx-wash" class="fx wash-away" hidden>
  <picture class="fx-picture">
    <source media="(max-width: 560px)" srcset="assets/phonecover.png">
    <img src="assets/cover.jpg" alt="" class="fx-img negative">
  </picture>
</div>
<div id="fx-blink" class="fx-blink flash-pop" hidden></div>

<!-- ============ FILM GRAIN ============ -->
<div class="grain" aria-hidden="true"></div>

<script src="app.js?v=20260929-2" defer></script>
</body>
</html>
